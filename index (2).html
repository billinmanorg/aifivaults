<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AiFi Vaults — Own your AI relationship</title>
<meta name="description" content="AiFi Vaults turn the data, knowledge, content, identity, and relationships your community already creates into a protected intelligence layer for AI — and a foundation for new revenue." />
<meta property="og:title" content="AiFi Vaults — Own your AI relationship" />
<meta property="og:description" content="Your customers are entering the AI economy. Make sure they enter through you." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AiFi Vaults V1.2 — visual system
   Palette and type from AiFi Brand Guidelines v1.0
   ============================================================ */
:root{
  --ink:#08090C; --ink-2:#0B0D11; --ink-3:#0F1115;
  --panel:#141922; --panel-2:#11161D;
  --line:#1C222B; --line-2:#2B3340;
  --fg:#FFFFFF; --fg-2:#C7CDD6; --muted:#868D97;
  --blue:#2D7FF9; --cyan:#44C7F4; --green:#3CCB7F; --amber:#FFB547; --red:#FF5D5D;
  --violet:#8B7BF7;
  --grad:linear-gradient(135deg,#2D7FF9 0%,#44C7F4 100%);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
  --wide:1200px; --mid:1040px; --narrow:720px;
  --hdr:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 24px)}
body{background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:5px}
::selection{background:rgba(68,199,244,.3)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#232a35;border-radius:20px;border:3px solid transparent;background-clip:content-box}
.skip{position:absolute;left:-9999px;z-index:300;background:var(--panel);border:1px solid var(--line-2);padding:10px 16px;border-radius:8px}
.skip:focus{left:14px;top:14px}
[hidden]{display:none !important}

/* ---------- editorial type ---------- */
h1,h2,h3,h4{letter-spacing:-.03em;line-height:1.1;font-weight:700}
h1{font-size:clamp(36px,5.6vw,68px);letter-spacing:-.04em;line-height:1.04}
h2{font-size:clamp(28px,3.8vw,46px);letter-spacing:-.035em}
h3{font-size:clamp(19px,1.9vw,25px);letter-spacing:-.022em}
h4{font-size:17px;letter-spacing:-.014em}
h2.as-h3,h3.as-h3{font-size:clamp(19px,1.9vw,25px);letter-spacing:-.022em}
h2.as-h4,h3.as-h4{font-size:17px;letter-spacing:-.014em}
p{color:var(--fg-2)}
.lede{font-size:clamp(16px,1.55vw,20px);color:var(--fg-2);max-width:58ch;line-height:1.6}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:var(--cyan);display:block;margin-bottom:18px}
.eyebrow.grey{color:var(--muted)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.small{font-size:13.5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.center{text-align:center}.mw-c{max-width:60ch;margin-left:auto;margin-right:auto}

/* ---------- layout ---------- */
.shell{width:100%;max-width:var(--wide);margin:0 auto;padding:0 26px}
.shell-mid{width:100%;max-width:var(--mid);margin:0 auto;padding:0 26px}
.shell-narrow{width:100%;max-width:var(--narrow);margin:0 auto;padding:0 26px}
.section{padding:clamp(64px,9vw,128px) 0;position:relative}
.section.tight{padding:clamp(44px,6vw,76px) 0}
.section.hair{border-top:1px solid rgba(28,34,43,.9)}
.section.wash{background:radial-gradient(1100px 600px at 50% 0%,rgba(45,127,249,.07),transparent 70%)}
.sec-head{margin-bottom:clamp(34px,5vw,58px)}
.sec-head p{margin-top:16px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mt{margin-top:30px}.mt-s{margin-top:16px}.mt-l{margin-top:54px}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:var(--r-sm);
  border:1px solid transparent;font-size:15.5px;font-weight:600;cursor:pointer;letter-spacing:-.008em;
  transition:transform .12s,filter .18s,background .18s,border-color .18s;text-align:center;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad);color:#04121f;box-shadow:0 8px 30px -12px rgba(68,199,244,.5)}
.btn-primary:hover{filter:brightness(1.09)}
.btn-ghost{background:rgba(255,255,255,.02);border-color:var(--line-2);color:var(--fg-2)}
.btn-ghost:hover{border-color:#3d4756;color:var(--fg);background:rgba(255,255,255,.05)}
.btn-quiet{background:none;border-color:transparent;color:var(--fg-2);padding-left:10px;padding-right:10px}
.btn-quiet:hover{color:var(--fg)}
.btn-sm{padding:9px 15px;font-size:13.5px;border-radius:8px}
.btn-block{width:100%}
.btn .lk{width:13px;height:13px;opacity:.75;flex:none}

/* ---------- public header ---------- */
.site-header{position:sticky;top:0;z-index:70;background:rgba(8,9,12,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(28,34,43,.9)}
.site-header .bar{display:flex;align-items:center;gap:26px;height:var(--hdr)}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo .wordmark{height:23px;width:58px;display:block;font-family:var(--sans)}
.logo .wm{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.site-nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.site-nav a{padding:8px 13px;border-radius:8px;font-size:14.5px;color:var(--fg-2);transition:.15s}
.site-nav a:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.hdr-cta{display:flex;align-items:center;gap:10px;flex:none}
.burger{display:none;background:none;border:1px solid var(--line-2);border-radius:8px;width:38px;height:38px;cursor:pointer;color:var(--fg-2);place-items:center}
.mobile-nav{display:none;border-top:1px solid var(--line);padding:10px 0 20px}
.mobile-nav.open{display:block}
.mobile-nav a{display:block;padding:13px 4px;font-size:17px;color:var(--fg-2);border-bottom:1px solid rgba(28,34,43,.9)}
.mobile-nav .row{margin-top:18px}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:clamp(48px,7vw,104px) 0 clamp(40px,6vw,84px)}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,68px);align-items:center}
.hero h1{margin-bottom:24px}
.hero h1 .l2{display:block}
.hero .lede{margin-bottom:30px}
.markers{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:34px}
.marker{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--fg-2)}
.marker i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  border:1px solid var(--line-2);background:var(--ink-3)}
.marker i svg{width:13px;height:13px;color:var(--cyan)}

/* ---------- signature vault visual ---------- */
.vault-visual{width:100%;max-width:600px;margin:0 auto;position:relative}
.vault-visual svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes drift{to{stroke-dashoffset:-260}}
@keyframes ringSweep{to{transform:rotate(360deg)}}
@keyframes corePulse{0%,100%{opacity:.5}50%{opacity:.95}}
@keyframes flowDot{0%{offset-distance:0%;opacity:0}8%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vv-ring{transform-origin:center;animation:ringSweep 28s linear infinite}
.vv-ring-2{transform-origin:center;animation:ringSweep 44s linear infinite reverse}
.vv-glow{animation:corePulse 4.2s ease-in-out infinite}
.vv-stream{stroke-dasharray:5 9;animation:drift 3.4s linear infinite}
.vv-dot{r:3.2;fill:var(--cyan);animation:flowDot 4.4s linear infinite}
.vv-dot.gold{fill:var(--amber)}
.vv-dot.violet{fill:var(--violet)}
.vv-label{font-family:var(--mono);font-size:8.4px;letter-spacing:.14em;text-transform:uppercase;fill:var(--muted)}
.vv-label.on{fill:#a7dcf5}
.vv-title{font-family:var(--mono);font-size:9.6px;letter-spacing:.2em;text-transform:uppercase;fill:#8fdcf8}
.vv-cap{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.vv-cap span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vv-cap b{color:#8fdcf8;font-weight:500}

/* ============================================================
   CARDS / PRIMITIVES
   ============================================================ */
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);
  border-radius:var(--r);padding:26px;transition:border-color .2s,transform .2s}
.card.link{cursor:pointer;display:block;text-align:left;width:100%}
.card.link:hover{border-color:#37424f;transform:translateY(-3px)}
.card h2,.card h3,.card h4{margin-bottom:10px}
.card p{font-size:14.5px;line-height:1.62}
.card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--ink-3);margin-bottom:17px}
.card .ic svg{width:19px;height:19px;color:var(--cyan)}
.card .more{display:inline-block;margin-top:16px;font-size:13.5px;color:var(--cyan);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 10px;border-radius:100px;border:1px solid var(--line-2);color:var(--fg-2);background:var(--panel-2);white-space:nowrap}
.tag.blue{border-color:rgba(45,127,249,.45);color:#8fbcff;background:rgba(45,127,249,.11)}
.tag.cyan{border-color:rgba(68,199,244,.45);color:#8fdcf8;background:rgba(68,199,244,.11)}
.tag.green{border-color:rgba(60,203,127,.45);color:#7ee0ab;background:rgba(60,203,127,.11)}
.tag.amber{border-color:rgba(255,181,71,.45);color:#ffd08f;background:rgba(255,181,71,.11)}
.tag.violet{border-color:rgba(139,123,247,.45);color:#bdb4fb;background:rgba(139,123,247,.11)}
.tag.red{border-color:rgba(255,93,93,.45);color:#ff9d9d;background:rgba(255,93,93,.11)}
.tag.grey{color:var(--muted)}
.list{list-style:none;display:grid;gap:12px}
.list li{position:relative;padding-left:26px;font-size:15px;color:var(--fg-2);line-height:1.55}
.list li::before{content:'';position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:2px;background:var(--grad)}
.list.check li::before{left:1px;top:6px;width:12px;height:7px;border:2px solid var(--green);border-top:0;border-right:0;transform:rotate(-45deg);background:none;border-radius:0}
.illus{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--amber);
  border:1px solid rgba(255,181,71,.3);background:rgba(255,181,71,.07);border-radius:100px;padding:3px 11px;font-weight:500}
.disclaimer{border:1px solid var(--line);border-left:2px solid var(--amber);background:var(--panel-2);
  border-radius:var(--r-sm);padding:15px 17px;font-size:13px;color:var(--muted);line-height:1.6}
.gate{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.gate svg{width:11px;height:11px;color:var(--amber)}

/* ============================================================
   ASK AiFi VAULTS  (chat)
   ============================================================ */
.ask{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--panel-2));overflow:hidden;max-width:800px;margin:0 auto}
.ask-top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ask-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;
  border:1px solid rgba(68,199,244,.45);background:linear-gradient(150deg,rgba(45,127,249,.25),rgba(15,17,21,.9))}
.ask-mark svg{width:16px;height:16px;color:var(--cyan)}
.ask-top b{font-size:14.5px;display:block;line-height:1.25}
.ask-top span{font-size:12px;color:var(--muted)}
.ask-body{padding:20px;min-height:190px;max-height:390px;overflow-y:auto}
.msg{display:flex;gap:11px;margin-bottom:16px;animation:fadeUp .28s both}
.msg .av{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10px;font-family:var(--mono)}
.msg.bot .av{border:1px solid rgba(68,199,244,.4);background:rgba(45,127,249,.14);color:var(--cyan)}
.msg.you{flex-direction:row-reverse}
.msg.you .av{background:var(--grad);color:#04121f;font-weight:700}
.msg .txt{font-size:14.5px;line-height:1.6;color:var(--fg-2);max-width:82%;background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.msg.you .txt{background:rgba(45,127,249,.14);border-color:rgba(68,199,244,.3);color:var(--fg)}
.msg .txt b{color:var(--fg);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 16px}
.chip{padding:8px 14px;border-radius:100px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;color:var(--fg-2);cursor:pointer;transition:.15s;text-align:left}
.chip:hover{border-color:rgba(68,199,244,.5);color:var(--fg);background:rgba(68,199,244,.08)}
.ask-foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;align-items:center}
.ask-foot .input{flex:1}
.ask-gate{padding:20px}
.ask-gate .grid{gap:0 14px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:corePulse 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}

/* ============================================================
   WHY NOW — split comparison
   ============================================================ */
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.split-side{border:1px solid var(--line);border-radius:var(--r);padding:24px;background:var(--panel-2)}
.split-side.dim{opacity:.82}
.split-side h4,.split-side h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:20px;font-weight:500}
.split-side.good h4{color:#8fdcf8}
.split-side svg{width:100%;height:auto;display:block}
.split-list{list-style:none;display:grid;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.split-list li{font-size:13.5px;color:var(--muted);padding-left:20px;position:relative;line-height:1.5}
.split-list li::before{content:'';position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:2px;background:#3a4453}
.split-side.good .split-list li{color:var(--fg-2)}
.split-side.good .split-list li::before{background:var(--grad)}
.bottomline{text-align:center;margin-top:34px;font-size:clamp(19px,2.3vw,27px);font-weight:600;letter-spacing:-.026em}

/* ---------- exploded view ---------- */
.exploded{max-width:760px;margin:0 auto}
.exploded svg{width:100%;height:auto;display:block;overflow:visible}
.pac{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.pac div h4,.pac div h3{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8fdcf8;margin-bottom:10px}
.pac div p{font-size:14.5px}

/* ---------- flow chain ---------- */
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px}
.chain-node{flex:1;min-width:118px;text-align:center;padding:0 4px}
.chain-ic{width:50px;height:50px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;
  border:1px solid var(--line-2);background:var(--ink-3);position:relative}
.chain-ic svg{width:21px;height:21px;color:var(--cyan)}
.chain-node.key .chain-ic{border-color:rgba(68,199,244,.6);background:linear-gradient(150deg,rgba(45,127,249,.24),rgba(15,17,21,.9));box-shadow:0 0 0 5px rgba(45,127,249,.08)}
.chain-node b{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.chain-arrow{flex:0 0 26px;position:relative;padding-top:24px}
.chain-arrow::before{content:'';position:absolute;top:25px;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(68,199,244,.12),rgba(68,199,244,.5),rgba(68,199,244,.12))}
.chain-arrow i{position:absolute;top:23px;left:0;width:4px;height:4px;border-radius:50%;background:var(--cyan);animation:travel 3.2s linear infinite}
@keyframes travel{0%{left:0;opacity:0}14%{opacity:1}86%{opacity:1}100%{left:100%;opacity:0}}

/* ============================================================
   WHO IT'S FOR — buyer selector
   ============================================================ */
.selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.sel-tab{padding:11px 20px;border-radius:100px;border:1px solid var(--line-2);background:var(--panel-2);
  font-size:14.5px;color:var(--muted);cursor:pointer;transition:.16s;min-height:44px}
.sel-tab:hover{color:var(--fg-2);border-color:#3d4756}
.sel-tab[aria-selected=true]{background:rgba(45,127,249,.16);border-color:rgba(68,199,244,.55);color:#fff;font-weight:500}
.buyer{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,54px);align-items:center;animation:fadeUp .34s both}
.buyer .concept{font-family:var(--mono);font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#8fdcf8;margin-bottom:16px;display:block}
.buyer h3{margin-bottom:14px;font-size:clamp(22px,2.6vw,32px)}
.buyer p{font-size:16px;margin-bottom:22px}
.buyer-art{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);overflow:hidden;position:relative}
.buyer-art svg{width:100%;height:auto;display:block}
.slot-note{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:#5f6773;background:rgba(8,9,12,.72);padding:3px 8px;border-radius:5px}

/* ============================================================
   ECONOMY NETWORK
   ============================================================ */
.economy{position:relative;max-width:880px;margin:0 auto}
.economy svg{width:100%;height:auto;display:block;overflow:visible}
.enode{cursor:pointer}
.enode circle{transition:r .18s,fill .18s}
.enode:hover circle.hit,.enode:focus circle.hit{fill:rgba(68,199,244,.1)}
.enode text{font-family:var(--mono);font-size:8.2px;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted);transition:fill .18s}
.enode:hover text,.enode:focus text,.enode.on text{fill:#a7dcf5}
.enode:hover circle.dot,.enode.on circle.dot{r:5.4}
.ecap{margin-top:22px;min-height:52px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);
  padding:14px 18px;display:flex;align-items:center;gap:12px;max-width:680px;margin-left:auto;margin-right:auto}
.ecap .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8fdcf8;flex:none}
.ecap p{font-size:14px;margin:0}
.egroups{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.egroups span{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.egroups i{width:9px;height:9px;border-radius:3px;flex:none}

/* mobile chips for the economy + exploded views */
.mchips{display:none}
.mchip-group{margin-bottom:18px}
.mchip-group h5{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:9px;font-weight:500}
.mchip-row{display:flex;gap:7px;flex-wrap:wrap}
.mchip{padding:8px 13px;border-radius:100px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;color:var(--fg-2);cursor:pointer;min-height:40px}
.mchip[aria-pressed=true]{border-color:rgba(68,199,244,.55);background:rgba(68,199,244,.1);color:#fff}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{border-top:1px solid var(--line);padding:clamp(44px,6vw,70px) 0 36px;background:var(--ink-2)}
.foot-top{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
.foot-links{display:flex;gap:28px;flex-wrap:wrap;margin-left:auto}
.foot-links a{font-size:14.5px;color:var(--fg-2)}
.foot-links a:hover{color:var(--fg)}
.foot-bottom{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}
.foot-bottom p{font-size:12.5px;color:var(--muted)}

/* ============================================================
   FORMS
   ============================================================ */
.field{margin-bottom:17px}
.field label,.lbl{display:block;font-size:13px;font-weight:500;color:var(--fg-2);margin-bottom:8px}
.field .help{font-size:12.5px;color:var(--muted);margin-top:7px}
.input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 15px;font-size:15px;transition:.16s}
.input::placeholder{color:#5c636e}
.input:hover{border-color:var(--line-2)}
.input:focus{outline:none;border-color:var(--blue);background:#131922}
.input[aria-invalid=true]{border-color:var(--red)}
select.input{appearance:none;cursor:pointer;padding-right:38px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="96" height="38" viewBox="0 0 96 38"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%25" stop-color="%232D7FF9"/><stop offset="100%25" stop-color="%2344C7F4"/></linearGradient></defs><text x="0" y="28" font-family="Inter,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-1.2" fill="url(%23lg)">AiFi</text></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
textarea.input{resize:vertical;min-height:100px;line-height:1.55}
.err{color:#ff9d9d;font-size:13px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.checks{display:grid;gap:10px}
.checks label{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--fg-2);cursor:pointer}
.checks input{margin-top:3px;accent-color:#44C7F4;flex:none}

/* ============================================================
   SIGN IN
   ============================================================ */
.signin{display:grid;grid-template-columns:minmax(0,.56fr) minmax(0,.44fr);min-height:calc(100dvh - var(--hdr))}
.signin-l{display:flex;align-items:center;padding:clamp(34px,5vw,72px) 0}
.signin-r{border-left:1px solid var(--line);background:radial-gradient(700px 500px at 70% 30%,rgba(45,127,249,.13),transparent 70%);
  display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,4vw,56px)}
.signin-r h2{font-size:clamp(26px,3vw,38px);margin-bottom:14px}
.deeper{display:grid;gap:12px;margin-top:30px}
.deeper div{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--fg-2)}
.deeper i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;border:1px solid var(--line-2);background:var(--ink-3)}
.deeper i svg{width:14px;height:14px;color:var(--cyan)}

/* ============================================================
   PORTAL SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100dvh}
.sidebar{background:var(--ink-2);border-right:1px solid var(--line);height:100dvh;position:sticky;top:0;display:flex;flex-direction:column}
.sidebar .logo{padding:20px}
.nav{flex:1;overflow-y:auto;padding:8px 12px 24px}
.nav-group{margin-bottom:20px}
.nav-group > h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:#5c636e;padding:0 10px;margin-bottom:7px;font-weight:500}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--fg-2);position:relative;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.nav a.on{background:rgba(45,127,249,.15);color:var(--fg);font-weight:500}
.nav a.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:2px;background:var(--grad);border-radius:2px}
.nav a svg{width:15px;height:15px;flex:none;opacity:.72}
.nav a.on svg{opacity:1;color:var(--cyan)}
.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 clamp(16px,3vw,32px);
  position:sticky;top:0;z-index:40;background:rgba(8,9,12,.86);backdrop-filter:blur(14px)}
.crumb{font-size:13.5px;color:var(--muted);display:flex;gap:8px;min-width:0}
.crumb b{color:var(--fg-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:9px;padding:5px 13px 5px 6px;border:1px solid var(--line);border-radius:100px;background:var(--panel-2)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#04121f;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.who b{display:block;font-size:12.5px;line-height:1.2}
.who span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.page{padding:clamp(24px,3.4vw,42px) clamp(16px,3.4vw,34px) 90px;max-width:1200px}
.page-head{margin-bottom:30px}
.page-head h1{font-size:clamp(28px,3.2vw,40px);margin-bottom:14px}

/* ---------- portal home modules (editorial, varying sizes) ---------- */
.modules{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.mod{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--panel-2));
  overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s;display:flex;flex-direction:column;text-align:left}
.mod:hover{border-color:#37424f;transform:translateY(-3px)}
.mod .art{position:relative;background:var(--ink-3);border-bottom:1px solid var(--line)}
.mod .art svg{width:100%;height:auto;display:block}
.mod .txt{padding:20px 22px 24px}
.mod h3,.mod h2{margin-bottom:8px}
.mod p{font-size:14px}
.mod.wide{grid-column:span 4}
.mod.half{grid-column:span 3}
.mod.third{grid-column:span 2}
.mod .tagrow{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}

/* ============================================================
   TOOLS
   ============================================================ */
.tool{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.tool-panel{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:sticky;top:78px}
.tool-stage{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);padding:22px;overflow:hidden}
.tool-stage svg{width:100%;height:auto;display:block;overflow:visible}
.streams{display:grid;gap:7px;max-height:460px;overflow-y:auto;padding-right:4px}
.stream{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--ink-3);cursor:pointer;transition:.15s;text-align:left;width:100%;min-height:42px}
.stream:hover{border-color:#3d4756}
.stream[aria-pressed=true]{border-color:rgba(68,199,244,.55);background:rgba(68,199,244,.09)}
.stream .sw{width:9px;height:9px;border-radius:3px;flex:none;background:#39424f;transition:.15s}
.stream[aria-pressed=true] .sw{background:var(--cyan)}
.stream b{font-size:13.5px;font-weight:500;flex:1}
.stream .kind{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{padding:9px 16px;border-radius:100px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13.5px;color:var(--muted);cursor:pointer;transition:.15s;min-height:40px}
.tab:hover{color:var(--fg-2);border-color:#3d4756}
.tab[aria-selected=true],.tab.on{background:rgba(45,127,249,.16);border-color:rgba(68,199,244,.55);color:#fff;font-weight:500}
.ctl{margin-bottom:19px}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.ctl-top label{font-size:13.5px;color:var(--fg-2);font-weight:500}
.ctl-top output{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--cyan)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:#242c37;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--grad);border:2px solid #08090C;box-shadow:0 0 0 1px rgba(68,199,244,.5)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#44C7F4;border:2px solid #08090C}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(20px,2.2vw,28px);font-weight:600;letter-spacing:-.03em;margin-top:8px}
.stat .n{font-size:12px;color:var(--muted);margin-top:5px}
.stat.hero{border-color:rgba(68,199,244,.4);background:linear-gradient(160deg,rgba(45,127,249,.15),rgba(17,22,29,.6))}
.stat.hero .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-list > div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid rgba(28,34,43,.85);font-size:14.5px}
.result-list > div:last-child{border-bottom:none}
.result-list b{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.result-list .lead{background:rgba(45,127,249,.08);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px}
.split-bar{display:flex;height:10px;border-radius:20px;overflow:hidden;background:#1a2029;margin:16px 0 14px}
.split-bar i{display:block;height:100%;transition:width .35s cubic-bezier(.4,0,.2,1)}
.legend{display:grid;gap:9px}
.legend .li{display:flex;align-items:center;gap:10px;font-size:14px}
.legend .li i{width:9px;height:9px;border-radius:3px;flex:none}
.legend .li b{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.log{font-family:var(--mono);font-size:12px;line-height:1.7;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:250px;overflow-y:auto}
.log div{padding:3px 0;color:var(--muted);animation:fadeUp .3s both}
.log div b{color:#8fdcf8;font-weight:500}
.log div.ok b{color:#7ee0ab}

/* ============================================================
   RESOURCES — premium media library
   ============================================================ */
.res-hero{display:grid;grid-template-columns:1.25fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel-2)}
.res-hero .art{position:relative;background:var(--ink-3)}
.res-hero .art svg{width:100%;height:100%;display:block}
.res-hero .txt{padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;justify-content:center}
.res-hero h3{font-size:clamp(21px,2.4vw,29px);margin:14px 0 12px}
.rowscroll{display:grid;grid-auto-flow:column;grid-auto-columns:264px;gap:16px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.rowscroll > *{scroll-snap-align:start}
.res-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel-2);cursor:pointer;transition:.2s;text-align:left;display:block;width:100%}
.res-card:hover{border-color:#37424f;transform:translateY(-3px)}
.res-card .art{position:relative;border-bottom:1px solid var(--line);background:var(--ink-3)}
.res-card .art svg{width:100%;height:auto;display:block}
.res-card .txt{padding:15px 16px 18px}
.res-card h4,.res-card h3{margin-bottom:6px;font-size:15px}
.res-card p{font-size:13px;color:var(--muted);line-height:1.5}
.res-card .meta{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-items:center}
.kind-badge{position:absolute;left:10px;top:10px}
.dur-badge{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:10px;background:rgba(8,9,12,.72);padding:3px 8px;border-radius:5px;color:var(--fg-2)}
.collections{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}

/* ---------- tables / drawer / modal ---------- */
.tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel-2)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
caption{text-align:left;padding:14px 16px;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line)}
thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:500;padding:11px 14px;border-bottom:1px solid var(--line);background:#12171f;white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid rgba(28,34,43,.8);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:rgba(255,255,255,.032)}
td .name{font-weight:600;font-size:14px}
td .org{font-size:12px;color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.col > header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.col > header b{font-size:12.5px}
.col > header span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.mini:hover{border-color:#3a4453}
.mini b{display:block;font-size:13px}
.mini span{font-size:11.5px;color:var(--muted)}
.mini .val{font-family:var(--mono);font-size:12px;color:var(--cyan);margin-top:6px;display:block}
.scrim{position:fixed;inset:0;background:rgba(4,5,8,.7);backdrop-filter:blur(3px);z-index:90;display:none}
.scrim.on{display:block;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(470px,100%);z-index:91;background:var(--ink-2);border-left:1px solid var(--line);display:none;flex-direction:column}
.drawer.on{display:flex;animation:slideIn .25s cubic-bezier(.2,.8,.3,1) both}
.drawer > header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .body{flex:1;overflow-y:auto;padding:20px}
.drawer .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px}
.modal{position:fixed;inset:0;z-index:91;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r);width:min(760px,100%);max-height:88dvh;overflow:auto;animation:fade .2s both}
.modal .box > header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.modal .box .body{padding:20px}
.x{background:none;border:1px solid var(--line);width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted);flex:none;font-size:17px;line-height:1}
.x:hover{color:var(--fg);border-color:var(--line-2)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 12px;font-size:14px;align-items:center}
.kv dt{color:var(--muted);font-size:12.5px}
.note{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;color:var(--fg-2);margin-bottom:8px}
.note time{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:5px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:46px 26px;text-align:center;background:var(--panel-2)}
.empty h4,.empty h3{margin-bottom:9px}
.empty p{font-size:14px;max-width:46ch;margin:0 auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,26px);z-index:120;background:#151b24;border:1px solid var(--line-2);
  border-radius:100px;padding:11px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.3,1);
  display:flex;align-items:center;gap:9px;max-width:92vw;box-shadow:0 18px 50px -22px rgba(0,0,0,.9)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}

@media print{
  .site-header,.site-footer,.sidebar,.topbar,#toast,.scrim,.drawer,.no-print{display:none !important}
  body{background:#fff}.app{grid-template-columns:1fr}.page{padding:0}
  *{color:#000 !important;background-image:none !important}
  .card,.tool-panel,.tool-stage,.stat,.tablewrap{border-color:#ccc;background:#fff !important}
  .grad-text{color:#0B4FA8 !important}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:1100px){
  .tool{grid-template-columns:1fr}
  .tool-panel{position:static}
  .modules{grid-template-columns:repeat(4,1fr)}
  .mod.wide,.mod.half{grid-column:span 4}
  .mod.third{grid-column:span 2}
}
@media(max-width:960px){
  .site-nav{display:none}
  .burger{display:grid}
  .hdr-cta .btn-ghost{display:none}
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:100;width:272px;transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.3,1)}
  .sidebar.open{transform:none}
  .hero-grid,.buyer,.split,.res-hero{grid-template-columns:1fr}
  .hero-grid > div:last-child{order:-1}
  .signin{grid-template-columns:1fr;min-height:0}
  .signin-r{display:none}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .pac{grid-template-columns:1fr;gap:22px}
}
@media(max-width:700px){
  body{font-size:16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .modules{grid-template-columns:1fr}
  .mod.wide,.mod.half,.mod.third{grid-column:span 1}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dt{margin-top:10px}
  /* mobile-specific compositions, not shrunk desktop diagrams */
  .economy .desk-only,.exploded .desk-only{display:none}
  .mchips{display:block}
  .markers{gap:14px;flex-direction:column}
  .chain{display:block}
  .chain-node{display:flex;align-items:center;gap:14px;text-align:left;padding:9px 0;min-width:0}
  .chain-ic{margin:0;flex:none;width:44px;height:44px}
  .chain-arrow{flex:none;height:16px;padding:0;margin-left:21px;width:2px}
  .chain-arrow::before{top:0;bottom:0;left:0;right:auto;width:1px;height:16px;background:rgba(68,199,244,.4)}
  .chain-arrow i{display:none}
  .foot-links{margin-left:0;gap:16px}
  .selector{gap:7px}
  .sel-tab{padding:11px 15px;font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>

<body>
<a class="skip" href="#main">Skip to main content</a>
<div id="root"></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden></div>
<div id="toast" role="status" aria-live="polite"><span class="dot"></span><span id="toast-msg"></span></div>

<script>
/* ============================================================
   AiFi Vaults — V1.2
   Public: one scrolling sales landing page.
   Gated: the portal, where the depth lives.
   ============================================================ */
"use strict";

/* Seeded accounts and sample content exist only when this is true.
   Set to false for production: no local accounts, auth via the API. */
const DEMO_MODE = true;

/* ---------- formatting ---------- */
const money = n => { const a = Math.abs(n);
  if (a >= 1e9) return '$' + (n/1e9).toFixed(a >= 1e10 ? 1 : 2) + 'B';
  if (a >= 1e6) return '$' + (n/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e3) return '$' + Math.round(n/1e3) + 'K';
  return '$' + n.toFixed(a < 10 && a > 0 ? 2 : 0); };
const money0 = n => '$' + Math.round(n).toLocaleString('en-US');
const cents = n => '$' + n.toFixed(2);
const num = n => { const a = Math.abs(n);
  if (a >= 1e6) return (n/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e3) return Math.round(n/1e3) + 'K';

function navigate(p, replace){ if (replace) location.replace('#' + p); else location.hash = p; }

function parseHash(){
  let raw = (location.hash || '#/').slice(1);
  if (!raw.startsWith('/')) raw = '/' + raw;
  const hashIdx = raw.indexOf('#');
  const anchor = hashIdx >= 0 ? raw.slice(hashIdx + 1) : '';
  let path = (hashIdx >= 0 ? raw.slice(0, hashIdx) : raw).split('?')[0];
  path = path.replace(/\/+$/,'') || '/';
  return { path, anchor };
}

/* Resolve redirects and gating up front so the correct page renders on the
   first pass. Relying on hashchange to re-render leaves a flash of the wrong
   page, because the event is queued rather than dispatched synchronously. */
function resolve(){
  let { path, anchor } = parseHash();
  for (let hop = 0; hop < 10; hop++){
    if (REDIRECTS[path]){
      const target = REDIRECTS[path];
      const i = target.indexOf('#');
      path = i >= 0 ? (target.slice(0, i) || '/') : target;
      anchor = i >= 0 ? target.slice(i + 1) : '';
      location.replace('#' + target);
      continue;
    }
    const r = ROUTES[path];
    if (r && r.access !== 'public' && !signedIn()){
      S.pending = path; path = '/sign-in'; anchor = '';
      location.replace('#/sign-in');
      continue;
    }
    if (path === '/' && signedIn()){
      path = '/portal'; anchor = '';
      location.replace('#/portal');
      continue;
    }
    break;
  }
  return { path, anchor };
}

function render(){
  const { path, anchor } = resolve();

  let r = ROUTES[path];
  if (!r) r = { title:'Page not found', access:'public', view:NotFound };

  if (r.access !== 'public' && r.access !== 'auth' && !can(r.access)){
    const t = r.title;
    r = { title:'Access restricted', access:'auth', view:() => Denied(t) };
  }

  S.path = path;
  document.title = path === '/' ? brand().name + ' — Own your AI relationship' : r.title + ' — ' + brand().name;

  const body = r.view();
  $('#root').innerHTML = (signedIn() && path !== '/sign-in') ? AppShell(body, r.title) : PublicShell(body, path);

  if (anchor){
    const el = document.getElementById(anchor);
    if (el) requestAnimationFrame(() => { if (el.scrollIntoView) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block:'start' }); });
    else window.scrollTo(0,0);
  } else window.scrollTo(0,0);

  track('view', path + (anchor ? '#' + anchor : ''));
  if (typeof afterRender[path] === 'function') afterRender[path]();
  bindCommon();
}

function bindCommon(){
  const b = $('#burger');
  if (b) b.addEventListener('click', () => {
    const m = $('#mobile-nav'), s = $('#sidebar');
    const t = m || s; if (!t) return;
    const open = t.classList.toggle('open');
    b.setAttribute('aria-expanded', String(open));
  });
  const so = $('#signout');
  if (so) so.addEventListener('click', e => { e.preventDefault(); signOut(); });
  $$('a[href^="#/"]').forEach(a => a.addEventListener('click', () => {
    const s = $('#sidebar'); if (s) s.classList.remove('open');
    const m = $('#mobile-nav'); if (m) m.classList.remove('open');
  }));
}

function signOut(){
  log('Signed out'); S.user = null; S.scenarios = []; S.prefill = null;
  navigate('/', true); toast('You have been signed out');
}


/* ============================================================
   VISUAL SYSTEM
   One grammar everywhere:
     Vault        = translucent faceted hexagon
     Permission   = aqua ring
     Data / input = aqua particles travelling thin curves
     AI           = violet
     Value        = amber, and it always loops back
   Every diagram is code-native SVG. No raster placeholders.
   ============================================================ */

const HEX = (cx, cy, r) => {
  const p = [];
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 180 * (60 * i - 90);
    p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
};

const DEFS = `<defs>
<linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2D7FF9"/><stop offset="100%" stop-color="#44C7F4"/></linearGradient>
<linearGradient id="gV" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B7BF7"/><stop offset="100%" stop-color="#44C7F4"/></linearGradient>
<linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB547"/><stop offset="100%" stop-color="#FFD08F"/></linearGradient>
<linearGradient id="gFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#44C7F4" stop-opacity=".20"/><stop offset="100%" stop-color="#2D7FF9" stop-opacity=".05"/></linearGradient>
<radialGradient id="gCore"><stop offset="0%" stop-color="#44C7F4" stop-opacity=".34"/><stop offset="65%" stop-color="#2D7FF9" stop-opacity=".08"/><stop offset="100%" stop-color="#2D7FF9" stop-opacity="0"/></radialGradient>
<radialGradient id="gDim"><stop offset="0%" stop-color="#6B7583" stop-opacity=".22"/><stop offset="100%" stop-color="#6B7583" stop-opacity="0"/></radialGradient>
</defs>`;

/* Reusable Vault mark — the master metaphor, at any size. */
function vaultMark(cx, cy, r, opts){
  opts = opts || {};
  const inner = opts.inner !== false;
  return `<g>
    <circle cx="${cx}" cy="${cy}" r="${r*2.1}" fill="url(#gCore)"/>
    <polygon points="${HEX(cx,cy,r*1.34)}" fill="none" stroke="#2B3340" stroke-width="1"/>
    <polygon points="${HEX(cx,cy,r)}" fill="url(#gFace)" stroke="url(#gA)" stroke-width="1.4"/>
    <polygon points="${HEX(cx,cy,r*.62)}" fill="none" stroke="url(#gA)" stroke-width="1" opacity=".55"/>
    ${inner ? `<circle cx="${cx}" cy="${cy}" r="${r*.2}" fill="url(#gA)"/>` : ''}
  </g>`;
}

/* Permission ring — always aqua, always around the Vault. */
const permRing = (cx, cy, r, cls) =>
  `<circle class="${cls||''}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#gA)" stroke-width="1.4"
     stroke-dasharray="${(r*1.1).toFixed(0)} ${(r*5).toFixed(0)}" stroke-linecap="round" opacity=".9"/>`;

/* A particle that travels a path. Falls back to a static dot with reduced motion. */
let pathSeq = 0;
function flowPath(d, opts){
  opts = opts || {};
  const id = 'fp' + (++pathSeq);
  const cls = opts.cls || '';
  const dur = opts.dur || 4.4;
  const delay = opts.delay || 0;
  const stroke = opts.stroke || 'url(#gA)';
  return `<path id="${id}" d="${d}" fill="none" stroke="${stroke}" stroke-width="1.1" opacity="${opts.op||.42}"
    ${opts.dash !== false ? 'class="vv-stream"' : ''} stroke-linecap="round"/>
    <circle class="vv-dot ${cls}" style="offset-path:path('${d}');animation-duration:${dur}s;animation-delay:${delay}s"/>`;
}

/* ============================================================
   1. THE AiFi INTELLIGENCE CORE  (hero signature visual)
   COMMUNITY -> AiFi VAULT -> AI -> ECONOMIC ACTIVITY -> VALUE RETURNS
   ============================================================ */
function intelligenceCore(){
  const cx = 300, cy = 232, R = 74;
  const inside = ['Identity','Data','Content','Knowledge','Relationships','Memory','Permissions'];
  const innerNodes = inside.map((label, i) => {
    const a = Math.PI * 2 * (i / inside.length) - Math.PI / 2;
    const rr = R * 0.56;
    const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#8fdcf8" opacity=".9"><title>${label}</title></circle>`;
  }).join('');

  /* inputs, left */
  const inputs = [['People',34,86],['Customers',24,140],['Followers',24,196],['Documents',24,252],['Content',24,308],['Behavior',34,362]];
  const inFlows = inputs.map((n,i) =>
    flowPath(`M${n[1]+62} ${n[2]} C ${n[1]+140} ${n[2]}, ${cx-130} ${cy}, ${cx-R*0.95} ${cy}`, { delay:i*0.6, dur:4.6 })).join('');
  const inLabels = inputs.map(n => `<text class="vv-label" x="${n[1]}" y="${n[2]+3}">${n[0]}</text>`).join('');

  /* AI activations, right */
  const outs = [['AI Twin',520,104],['AI agents',520,158],['Applications',520,212],['Services',520,266],['Other Vaults',520,320]];
  const outFlows = outs.map((n,i) =>
    flowPath(`M${cx+R*0.95} ${cy} C ${cx+140} ${cy}, ${n[1]-70} ${n[2]}, ${n[1]-8} ${n[2]}`,
      { delay:i*0.55+0.3, dur:4.2, cls:'violet', stroke:'url(#gV)' })).join('');
  const outLabels = outs.map(n => `<text class="vv-label" x="${n[1]}" y="${n[2]+3}">${n[0]}</text>`).join('');

  /* economic outputs, below right; value loops back to community */
  const econ = ['Access','Membership','Services','Transactions','Rewards','Revenue'];
  const econChips = econ.map((e,i) =>
    `<g><rect x="${372 + (i%3)*78}" y="${396 + Math.floor(i/3)*26}" width="72" height="19" rx="9.5"
       fill="rgba(255,181,71,.09)" stroke="rgba(255,181,71,.4)"/>
     <text class="vv-label" x="${372 + (i%3)*78 + 36}" y="${396 + Math.floor(i/3)*26 + 13}" text-anchor="middle" fill="#ffd08f">${e}</text></g>`).join('');

  const valueLoop = flowPath(`M370 415 C 250 470, 110 440, 68 372 C 46 336, 50 300, 62 262`,
    { cls:'gold', stroke:'url(#gGold)', dur:6.2, delay:1.4, op:.34 });

  return `<div class="vault-visual">
  <svg viewBox="0 0 600 500" role="img" aria-labelledby="core-t core-d">
    <title id="core-t">The AiFi Intelligence Core</title>
    <desc id="core-d">A community's people, customers, followers, documents, content, and behavior flow into a protected AiFi Vault that holds identity, data, content, knowledge, relationships, memory, and permissions. A permission ring surrounds it. Approved intelligence flows outward to an AI Twin, AI agents, applications, services, and other Vaults, producing access, membership, services, transactions, rewards, and revenue. Value returns to the community.</desc>
    ${DEFS}
    <text class="vv-title" x="24" y="42">Community</text>
    <text class="vv-title" x="${cx}" y="42" text-anchor="middle">AiFi Vault</text>
    <text class="vv-title" x="576" y="42" text-anchor="end">AI + Economy</text>
    <line x1="24" y1="54" x2="576" y2="54" stroke="#1C222B"/>
    ${inFlows}${outFlows}
    <circle class="vv-ring" cx="${cx}" cy="${cy}" r="${R*1.62}" fill="none" stroke="#2B3340" stroke-width="1" stroke-dasharray="2 10"/>
    ${permRing(cx, cy, R*1.34, 'vv-ring-2')}
    ${vaultMark(cx, cy, R)}
    ${innerNodes}
    <text class="vv-label on" x="${cx}" y="${cy+R+26}" text-anchor="middle">Permissioned intelligence</text>
    ${inLabels}${outLabels}
    ${valueLoop}
    ${econChips}
    <text class="vv-label" x="366" y="452" fill="#ffd08f">Value returns to the community</text>
  </svg>
  <div class="vv-cap"><span>Community</span><b>&rarr;</b><span>AiFi Vault</span><b>&rarr;</b><span>AI</span><b>&rarr;</b><span>Economic activity</span><b>&rarr;</b><span>Value returns</span></div>
  </div>`;
}

    ${permRing(160,118,74,'vv-ring-2')}${vaultMark(160,118,50)}

    <text class="vv-label" x="160" y="236" text-anchor="middle">Ownership &#183; Permission &#183; Control</text>

  <div class="mchips" style="margin-top:22px">
    <div class="mchip-group"><h5 style="color:#8fdcf8">Inside the Vault</h5>

/* ============================================================

const CHAIN = [['people','Community'],['doc','Data + Knowledge'],['vault','AiFi Vault',true],['lock','Permission'],
  ['bot','AI Twins + Agents'],['swap','Services + Transactions'],['gift','Revenue + Rewards']];
function flowChain(){
  return '<div class="chain">' + CHAIN.map((n,i) =>
    '<div class="chain-node' + (n[2] ? ' key' : '') + '"><span class="chain-ic">' + ico(n[0]) + '</span><b>' + n[1] + '</b></div>' +
    (i < CHAIN.length - 1 ? '<div class="chain-arrow" aria-hidden="true"><i style="animation-delay:' + (i*.4).toFixed(1) + 's"></i></div>' : '')).join('') + '</div>';
}

/* ============================================================

   Photography slots are declared; SVG composition stands in until

function buyerArt(key){

function economyNetwork(){
  const cx = 430, cy = 250, nodes = [];
  let idx = 0;
  const total = ECON_GROUPS.reduce((a,g) => a + g.items.length, 0);
  const spokes = ECON_GROUPS.map((g, gi) => {
    const base = (gi / ECON_GROUPS.length) * Math.PI * 2 - Math.PI / 2;
    const spread = (Math.PI * 2 / ECON_GROUPS.length) * 0.74;
    const hubA = base;
    const hx = cx + 118 * Math.cos(hubA), hy = cy + 118 * Math.sin(hubA);
    const items = g.items.map((it, i) => {
      const a = base - spread/2 + (g.items.length === 1 ? spread/2 : spread * i / (g.items.length - 1));
      const r = 198;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a) * 0.94;
      const lx = cx + (r + 30) * Math.cos(a), ly = cy + (r + 30) * Math.sin(a) * 0.94;
      const anchor = Math.abs(Math.cos(a)) < 0.25 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
      nodes.push({ id:'e' + (idx++), name:it[0], desc:it[1], group:g.label, color:g.color });
      const id = 'e' + (idx - 1);
      return `<line x1="${hx.toFixed(0)}" y1="${hy.toFixed(0)}" x2="${x.toFixed(0)}" y2="${y.toFixed(0)}" stroke="${g.color}" stroke-width="1" opacity=".28"/>
        <g class="enode" data-node="${id}" tabindex="0" role="button" aria-label="${esc(it[0])}, ${esc(g.label)}">
          <circle class="hit" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="17" fill="transparent"/>
          <circle class="dot" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="4" fill="${g.color}"/>
          <text x="${lx.toFixed(0)}" y="${(ly+3).toFixed(0)}" text-anchor="${anchor}">${it[0]}</text></g>`;
    }).join('');
    return `<line x1="${cx}" y1="${cy}" x2="${hx.toFixed(0)}" y2="${hy.toFixed(0)}" stroke="${g.color}" stroke-width="1.3" opacity=".45"/>
      <circle cx="${hx.toFixed(0)}" cy="${hy.toFixed(0)}" r="7" fill="#0F1115" stroke="${g.color}" stroke-width="1.4"/>
      <text class="vv-label" x="${hx.toFixed(0)}" y="${(hy - 16).toFixed(0)}" text-anchor="middle" fill="${g.color}">${g.label}</text>
      ${items}`;
  }).join('');

  ECON_NODES = nodes;
  return `<div class="economy"><svg class="desk-only" viewBox="0 0 860 500" role="img" aria-label="A network of ${total} value streams grouped into access, AI, commerce, and community, all radiating from one Vault economy at the center.">
    ${DEFS}
    ${spokes}
    <circle cx="${cx}" cy="${cy}" r="62" fill="url(#gCore)"/>
    ${permRing(cx,cy,52,'vv-ring-2')}${vaultMark(cx,cy,34)}
    <text class="vv-title" x="${cx}" y="${cy+78}" text-anchor="middle">Your Vault Economy</text>
  </svg>
  <svg class="mob-only" viewBox="0 0 320 200" role="img" aria-label="One Vault economy at the center." style="display:none">
    ${DEFS}${permRing(160,100,60,'vv-ring-2')}${vaultMark(160,100,40)}
    <text class="vv-title" x="160" y="180" text-anchor="middle">Your Vault Economy</text></svg>
  <div class="ecap" id="ecap" aria-live="polite"><span class="k">Explore</span><p>Hover, tap, or focus any stream to see what it does.</p></div>
  <div class="egroups">${ECON_GROUPS.map(g => `<span><i style="background:${g.color}"></i>${g.label}</span>`).join('')}</div>
  <div class="mchips" style="margin-top:20px">${ECON_GROUPS.map(g =>
    `<div class="mchip-group"><h5 style="color:${g.color}">${g.label}</h5><div class="mchip-row">` +
    g.items.map(it => `<button class="mchip" data-mnode="${esc(it[0])}" aria-pressed="false">${it[0]}</button>`).join('') +
    '</div></div>').join('')}</div></div>`;
}

      '<button class="btn btn-primary" type="submit">Start asking</button></form></div></div>';
  }
  return '<div class="ask"><div class="ask-top"><span class="ask-mark">' + ico('vault') + '</span>' +
    '<span><b>' + esc(S.cms.askHeading) + '</b><span>Chatting with ' + esc(a.name.split(' ')[0]) + '</span></span>' +

    '<div class="ask-body" id="ask-body">' + a.log.map(m =>
      '<div class="msg ' + m.who + '"><span class="av">' + (m.who === 'bot' ? 'AI' : esc(a.name.charAt(0).toUpperCase())) + '</span>' +
      '<span class="txt">' + m.text + '</span></div>').join('') + '</div>' +
    '<div class="chips">' + ASK_Q.map((q,i) => '<button class="chip" data-ask="' + i + '">' + esc(q[0]) + '</button>').join('') + '</div>' +
    '<div class="ask-foot"><label class="lbl" for="ask-input" style="position:absolute;left:-9999px">Ask a question</label>' +
    '<input class="input" id="ask-input" placeholder="Ask your own question" />' +
    '<button class="btn btn-primary btn-sm" id="ask-send">Send</button></div></div>';
}

function askAnswer(text){
  const t = text.toLowerCase();
  const exact = ASK_Q.find(q => q[0].toLowerCase() === t);
  if (exact) return exact[1];
  const kw = [
    [['money','revenue','earn','monetiz','make money','profit'], 1],
    [['protect','secure','privacy','safe','data protection'], 2],
    [['creator','influencer','follower'], 3],
    [['brand','customer','loyalty','retail'], 4],
    [['twin','agent','ai twin'], 5],
    [['token','tokeniz','angl','crypto'], 6],
    [['launch','start','begin','implement','how do i'], 7],
    [['what is','what are','vault','explain'], 0]
  ];
  for (const [words, idx] of kw) if (words.some(w => t.includes(w))) return ASK_Q[idx][1];
  if (t.includes('price') || t.includes('cost') || t.includes('how much'))
    return 'Pricing is scoped around the community size, the activation model, and how much a sponsor funds. Rather than quote a number here, the AiFi Vault Calculator inside the portal lets you model it, and the team will confirm a scoped figure. <b>Request a demo</b> and we will walk through your numbers.';
  if (t.includes('demo') || t.includes('talk') || t.includes('person') || t.includes('call'))
    return 'Happy to arrange that. Use <b>Request a Demo</b> at the top of the page and an AiFi administrator will follow up with you directly.';
  return 'That one is worth a proper answer rather than a guess from me. I have noted it against your details and someone from AiFi will come back to you. In the meantime, try one of the suggested questions, or <b>request a demo</b> for a walkthrough.';
}

function askPush(who, text){ S.ask.log.push({ who, text }); }

function askSay(text){
  askPush('you', esc(text));
  renderAsk();
  const body = $('#ask-body');
  if (body){
    body.insertAdjacentHTML('beforeend',
      '<div class="msg bot" id="ask-typing"><span class="av">AI</span><span class="txt"><span class="typing"><i></i><i></i><i></i></span></span></div>');
    body.scrollTop = body.scrollHeight;
  }
  const delay = reduceMotion() ? 0 : 520;
  setTimeout(() => {
    askPush('bot', askAnswer(text));
    const rec = CRM.find(r => r.email.toLowerCase() === S.ask.email.toLowerCase());
    if (rec) rec.notes.unshift('Asked AiFi Vaults: "' + text + '"');
    renderAsk();
  }, delay);
}

function renderAsk(){
  const host = $('#ask-host');
  if (!host) return;
  host.innerHTML = askMarkup();
  bindAsk();
  const b = $('#ask-body'); if (b) b.scrollTop = b.scrollHeight;
}

function bindAsk(){
  const gate = $('#ask-gate-form');
  if (gate) gate.addEventListener('submit', e => {
    e.preventDefault();
    const n = $('#ask-name'), em = $('#ask-email'), err = $('#ask-err');
    const badName = !n.value.trim(), badEmail = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value);
    n.setAttribute('aria-invalid', String(badName));
    em.setAttribute('aria-invalid', String(badEmail));
    if (badName || badEmail){
      err.hidden = false;
      err.innerHTML = '<span aria-hidden="true">&#9888;</span><span>We need a name and a valid email address before starting.</span>';
      (badName ? n : em).focus();
      return;
    }
    S.ask.name = n.value.trim(); S.ask.email = em.value.trim(); S.ask.captured = true;
    askPush('bot', 'Hi ' + esc(S.ask.name.split(' ')[0]) + ' — ask me anything about AiFi Vaults. Pick one of the questions below, or type your own.');
    upsertContact({ name:S.ask.name, email:S.ask.email, org:'', vault:'Not sure yet',
      status:'Asked AiFi Vaults', build:'Started a conversation in Ask AiFi Vaults on the homepage.' });
    log('Ask AiFi Vaults lead captured', S.ask.email);
    track('ask_started', S.ask.email);
    renderAsk();
    toast('Thanks — ask away');
  });
  $$('[data-ask]').forEach(b => b.addEventListener('click', () => {
    const q = ASK_Q[+b.dataset.ask];
    askPush('you', esc(q[0]));
    renderAsk();
    setTimeout(() => { askPush('bot', q[1]); renderAsk(); }, reduceMotion() ? 0 : 420);
    track('ask_question', q[0]);
  }));
  const send = $('#ask-send'), input = $('#ask-input');
  const go = () => { const v = (input.value || '').trim(); if (!v) return; input.value = ''; askSay(v); };
  if (send) send.addEventListener('click', go);
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } });
  const rs = $('#ask-reset');
  if (rs) rs.addEventListener('click', () => { S.ask = { open:false, captured:false, name:'', email:'', log:[] }; renderAsk(); });
}

function bindContactForm(px, status, msg){
  const f = document.getElementById(px + '-form');
  if (!f) return;
  const p = S.prefill || {};
  const set = (k,v) => { const el = document.getElementById(px + '-' + k); if (el && v) el.value = v; };
  set('next', p.next); set('vault', p.vault); set('build', p.build);
  if (S.user){ set('name', S.user.name); set('email', S.user.email); set('org', S.user.company); }
  if (S.ask.captured){ set('name', S.ask.name); set('email', S.ask.email); }
  f.addEventListener('submit', e => {
    e.preventDefault();
    const get = k => (document.getElementById(px + '-' + k) || {}).value || '';
    const errBox = document.getElementById(px + '-err');
    const missing = [];
    [['name','Name'],['org','Organization'],['email','Email'],['build','What are you trying to build?']].forEach(([k,l]) => {
      const el = document.getElementById(px + '-' + k);
      const bad = !el.value.trim() || (k === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value));
      el.setAttribute('aria-invalid', String(bad));
      if (bad) missing.push(l);
    });
    if (missing.length){
      errBox.hidden = false;
      errBox.innerHTML = '<span aria-hidden="true">&#9888;</span><span>Check these fields before sending: ' + esc(missing.join(', ')) + '.</span>';
      const first = f.querySelector('[aria-invalid=true]'); if (first) first.focus();
      return;
    }
    errBox.hidden = true;
    upsertContact({ name:get('name'), org:get('org'), email:get('email'), phone:get('phone'),
      vault:get('vault'), size:+get('size') || 0, build:get('build'), next:get('next'), status });
    S.prefill = null;
    f.innerHTML = '<div class="empty"><h3 class="as-h4">' + msg + '</h3><p>An AiFi administrator has your details and will be in touch.</p>' +
      '<div class="row" style="justify-content:center;margin-top:18px">' +
      '<a class="btn btn-ghost" href="#/portal/calculator">Open the calculator</a>' +
      '<a class="btn btn-ghost" href="#/portal/demos">Watch a demo</a></div></div>';
    toast(msg);
  });
}

   AiFi VAULT CALCULATOR
   ============================================================ */
const CALC_PRESETS = {
  'Influencer / Creator Vault':{ people:850000, activation:18, costPerRecord:0.03, sponsorFunding:85, monthlyPerVault:0.90 },
  'Brand Vault':               { people:2600000, activation:25, costPerRecord:0.05, sponsorFunding:55, monthlyPerVault:1.08 },
  'Celebrity Vault':           { people:8400000, activation:12, costPerRecord:0.03, sponsorFunding:80, monthlyPerVault:1.03 },
  'Enterprise Vault':          { people:400000, activation:45, costPerRecord:0.09, sponsorFunding:10, monthlyPerVault:2.40 },
  'Sponsor Vault':             { people:3140000, activation:40, costPerRecord:0.05, sponsorFunding:100, monthlyPerVault:0.92 },
  'Token Vault':               { people:500000, activation:30, costPerRecord:0.04, sponsorFunding:40, monthlyPerVault:1.25 }
};
const CALC_TYPES = Object.keys(CALC_PRESETS);

S.calc = { advanced:false, vaultType:'Brand Vault', people:2600000, activation:25, costPerRecord:0.05,
  sponsorFunding:55, monthlyPerVault:1.08, ownerShare:40, communityShare:15,
  sponsorRev:0.42, memberRev:0.44, signalRev:0.26, tokenAlloc:18, acuityShare:10, partnerShare:5,
  retention:92, conversion:2.4, signalFreq:6, sponsorCount:1 };

function compute(c){
  c = c || S.calc;
  const vaults = c.people * c.activation / 100;
  const activationCost = c.people * c.costPerRecord;
  const sponsorFunded = activationCost * c.sponsorFunding / 100;
  const remaining = activationCost - sponsorFunded;
  const arpv = c.advanced ? (c.sponsorRev * c.sponsorCount) + c.memberRev + (c.signalRev * (c.signalFreq / 6)) : c.monthlyPerVault;
  const monthly = vaults * arpv;
  const annual = monthly * 12 * (c.advanced ? c.retention / 100 : 1);
  const owner = Math.max(0, c.ownerShare), community = Math.max(0, c.communityShare);
  let acuity, partner, aifi;
  if (c.advanced){
    acuity = c.acuityShare; partner = c.partnerShare;
    aifi = Math.max(0, 100 - owner - community - acuity - partner);
  } else {
    const rest = Math.max(0, 100 - owner - community);
    const base = S.splits.aifi + S.splits.acuity + S.splits.partner || 1;
    aifi = rest * S.splits.aifi / base; acuity = rest * S.splits.acuity / base; partner = rest * S.splits.partner / base;
  }
  const tot = owner + community + aifi + acuity + partner || 1;
  const sh = p => annual * p / tot;
  return { vaults, activationCost, sponsorFunded, remaining, arpv, monthly, annual,
    ownerAmt:sh(owner), communityAmt:sh(community), aifiAmt:sh(aifi), acuityAmt:sh(acuity), partnerAmt:sh(partner),
    pctOwner:owner/tot*100, pctCommunity:community/tot*100, pctAifi:aifi/tot*100, pctAcuity:acuity/tot*100, pctPartner:partner/tot*100,
    tokenFlow:annual * c.tokenAlloc / 100, rewardPerMember:vaults > 0 ? sh(community) / vaults : 0,
    responses:vaults * (c.conversion / 100) };
}

/* ============================================================
   REVENUE STREAM EXPLORER
   ============================================================ */
const STREAMS = [
  ['Vault sales','one-time','access',3.20],['Memberships','recurring','access',0.42],
  ['Subscriptions','recurring','access',0.36],['Premium content','recurring','access',0.22],
  ['Experiences','transaction','access',0.18],['AI Twin access','recurring','ai',0.34],
  ['AI agent services','transaction','ai',0.26],['Enterprise services','recurring','ai',0.58],
  ['AI agents doing business','transaction','commerce',0.30],['Marketplace','transaction','commerce',0.20],
  ['Vault-to-Vault','transaction','commerce',0.24],['Sponsor funding','recurring','community',0.46],
  ['Token access','recurring','community',0.16],['Loyalty','recurring','community',0.14]
];
const STREAM_COLOR = { access:'#44C7F4', ai:'#8B7BF7', commerce:'#3CCB7F', community:'#FFB547' };
let activeStreams = ['Memberships','Sponsor funding','AI Twin access'];
let rseVaults = 250000;

function rseStage(){
  const on = STREAMS.filter(s => activeStreams.includes(s[0]));
  const cx = 320, cy = 230;
  const nodes = on.map((s,i) => {
    const a = Math.PI * 2 * i / Math.max(on.length,1) - Math.PI / 2;
    const r = 150;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a) * 0.86;
    const lx = cx + (r + 26) * Math.cos(a), ly = cy + (r + 26) * Math.sin(a) * 0.86;
    const anchor = Math.abs(Math.cos(a)) < 0.3 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
    const col = STREAM_COLOR[s[2]];
    return `${flowPath(`M${x.toFixed(0)} ${y.toFixed(0)} L${cx} ${cy}`, { dur:3.6, delay:i*.24, op:.32, stroke:col })}
      <circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="6" fill="${col}"/>
      <text class="vv-label on" x="${lx.toFixed(0)}" y="${(ly+3).toFixed(0)}" text-anchor="${anchor}">${s[0]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 640 470" role="img" aria-label="Your Vault economy with ${on.length} active value streams.">
    ${DEFS}${nodes}
    <circle cx="${cx}" cy="${cy}" r="${58 + on.length*2.4}" fill="url(#gCore)"/>
    ${permRing(cx,cy,52,'vv-ring-2')}${vaultMark(cx,cy,34)}
    <text class="vv-title" x="${cx}" y="${cy+80}" text-anchor="middle">Your Vault Economy</text>
    <text class="vv-label" x="${cx}" y="${cy+96}" text-anchor="middle">${on.length} active stream${on.length===1?'':'s'}</text>
  </svg>`;
}

function rseTotals(){
  const on = STREAMS.filter(s => activeStreams.includes(s[0]));
  const oneTime = on.filter(s => s[1] === 'one-time').reduce((a,s) => a + s[3], 0) * rseVaults;
  const recurring = on.filter(s => s[1] === 'recurring').reduce((a,s) => a + s[3], 0) * rseVaults * 12;
  const trans = on.filter(s => s[1] === 'transaction').reduce((a,s) => a + s[3], 0) * rseVaults * 12;
  const annual = recurring + trans;
  const sp = S.splits, tot = sp.owner + sp.community + sp.aifi + sp.acuity + sp.partner;
  return { on, oneTime, recurring, trans, annual,
    owner:annual * sp.owner / tot, community:annual * sp.community / tot, aifi:annual * sp.aifi / tot };
}

const MODELS = [

function modelFlow(m){
  const w = 700, y = 90;
  const step = w / m.chain.length;
  return `<svg viewBox="0 0 ${w} 180" role="img" aria-label="${esc(m.name)}: ${esc(m.chain.join(', then '))}.">

    ${m.chain.map((c,i) => {
      const x = step * i + step/2;
      const isVault = /deploy|launch/i.test(c);
      return `${i < m.chain.length-1 ? flowPath(`M${(x+52).toFixed(0)} ${y} L${(x+step-52).toFixed(0)} ${y}`, { dur:3.2, delay:i*.4, op:.34 }) : ''}
        ${isVault ? vaultMark(x, y, 26) : `<rect x="${(x-56).toFixed(0)}" y="${y-26}" width="112" height="52" rx="10" fill="#141922" stroke="${i===0?'rgba(255,181,71,.42)':'rgba(68,199,244,.32)'}"/>`}
        <text class="vv-label${isVault?' on':''}" x="${x.toFixed(0)}" y="${isVault ? y+48 : y+4}" text-anchor="middle">${c}</text>`;
    }).join('')}
  </svg>`;
}

/* ============================================================
   PER-RECORD CALCULATOR
   ============================================================ */
let prScale = 2;
const PR_STEPS = [100, 1000, 100000, 1000000];

function perRecordArt(){
  const n = PR_STEPS[prScale];
  const count = n <= 100 ? 12 : n <= 1000 ? 30 : n <= 100000 ? 70 : 130;
  const cols = Math.ceil(Math.sqrt(count * 1.9));
  const size = Math.max(2.2, 15 - cols * 0.42);
  const dots = Array.from({ length:count }, (_,i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const x = 60 + c * (620 / cols), y = 60 + r * (Math.min(24, 260 / Math.ceil(count/cols)));
    return count <= 30
      ? `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)})"><polygon points="${HEX(0,0,size*1.5)}" fill="url(#gFace)" stroke="url(#gA)" stroke-width=".9"/></g>`
      : `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${size.toFixed(1)}" fill="#44C7F4" opacity="${(0.32 + (i%5)*0.12).toFixed(2)}"/>`;
  }).join('');
  const links = count > 70 ? Array.from({ length:36 }, (_,i) => {
    const a = Math.random(), b = Math.random();
    return `<line x1="${(60+a*620).toFixed(0)}" y1="${(60+ (i%9)*26).toFixed(0)}" x2="${(60+b*620).toFixed(0)}" y2="${(60+((i+4)%9)*26).toFixed(0)}" stroke="#2D7FF9" stroke-width=".6" opacity=".18"/>`;
  }).join('') : '';
  return `<svg viewBox="0 0 740 340" role="img" aria-label="${num0(n)} records shown as ${num0(n)} Vaults, ${n >= 100000 ? 'forming a connected network' : 'each one an AI-ready relationship'}.">
    ${DEFS}${links}${dots}
    <text class="vv-title" x="370" y="322" text-anchor="middle">${num0(n)} records = ${num0(n)} Vaults = ${num0(n)} AI-ready relationships</text>
  </svg>`;
}

    if (d.vault && d.vault !== 'Not sure yet') rec.vault = d.vault;
    if (d.org) rec.org = d.org;
    rec.next = d.next || rec.next;
    if (bits.length) rec.notes.unshift(bits.join(' — '));
    log('Contact updated', rec.org + ' → ' + d.status);
  } else {
    rec = { id:nextCrmId++, name:d.name || 'New contact', org:d.org || '—', email:d.email || '', phone:d.phone || '',
      vault:d.vault || 'Not sure yet', size:d.size || 0, status:d.status, owner:'Unassigned',
      val:Math.max(50000, Math.round((d.size || 0) * 0.12)), act:'just now',
      next:d.next || 'Qualify and assign an owner', notes:bits.length ? [bits.join(' — ')] : [], scenarios:[],
      tokens:d.next === 'Explore Tokenization' ? ['Inquiry from the website'] : [] };
    CRM.unshift(rec);
    log('Contact created', rec.org + ' → ' + d.status);
  }
  if (S.prefill && S.prefill.scenario) rec.scenarios.unshift(S.prefill.scenario);
  return rec;
}

function editUser(idx){

  openDrawer(idx >= 0 ? 'Edit user' : 'Invite user',
    '<div class="body">' +

    '<div class="field"><label for="eu-org">Organization</label><input class="input" id="eu-org" value="' + esc(a.company || '') + '" /></div>' +
    '<div class="field"><label for="eu-role">Role</label><select class="input" id="eu-role">' +

}

/* ============================================================
   GLOBAL WIRING
   ============================================================ */
document.addEventListener('click', e => {
  if (e.target.closest('[data-closemodal]')){ closeModal(); return; }
  if (e.target.closest('[data-closedrawer]')){ closeDrawer(); return; }

  const rec = e.target.closest('[data-rec]');
  if (rec && !['SELECT','INPUT','TEXTAREA'].includes(rec.tagName) && rec.id !== 'dr-addnote'){ openRecord(+rec.dataset.rec); return; }

  if (e.target.id === 'dr-addnote'){
    const r = CRM.find(x => x.id === +e.target.dataset.rec);
    const v = ($('#dr-note') || {}).value || '';
    if (r && v.trim()){ r.notes.unshift(v.trim()); r.act = 'just now'; log('Note added', r.org); openRecord(r.id); toast('Note added'); }
    return;
  }
  if (e.target.id === 'nc-save'){
    const g = k => ($('#nc-' + k) || {}).value || '';
    CRM.unshift({ id:nextCrmId++, name:g('name') || 'New contact', org:g('org') || '—', email:g('email'), phone:'',
      vault:g('vault'), size:+g('size') || 0, status:g('status'), owner:'Unassigned', val:+g('val') || 50000,
      act:'just now', next:'Qualify and assign an owner', notes:[], scenarios:[], tokens:[] });
    log('Contact created', g('org')); closeDrawer(); render(); toast('Contact added'); return;
  }
  if (e.target.id === 'md-save'){
    const k = e.target.dataset.key, m = S.media[k];
    m.src = $('#md-src').value.trim(); m.alt = $('#md-alt').value;
    m.w = +$('#md-w').value || m.w; m.h = +$('#md-h').value || m.h;
    m.mw = +$('#md-mw').value || m.mw; m.mh = +$('#md-mh').value || m.mh;
    m.focal = $('#md-focal').value; m.sort = +$('#md-sort').value || m.sort;
    log('Media slot updated', k); closeDrawer(); render(); toast('Media slot saved'); return;
  }
  if (e.target.id === 'ed-save'){
    const g = k => ($('#ed-' + k) || {}).value || '';
    const id = +e.target.dataset.id;
    const d = { title:g('title') || 'Untitled demo', desc:g('desc'), art:g('art'), cat:g('cat'), dur:g('dur') || '0:00',
      url:g('url'), sort:+g('sort') || DEMOS.length + 1, featured:$('#ed-featured').checked };
    if (id){ Object.assign(DEMOS.find(x => x.id === id), d); log('Demo updated', d.title); }
    else { d.id = Math.max(0, ...DEMOS.map(x => x.id)) + 1; DEMOS.push(d); log('Demo created', d.title); }
    closeDrawer(); render(); toast('Demo saved'); return;
  }
  if (e.target.id === 'ed-del'){
    const id = +$('#ed-save').dataset.id, d = DEMOS.find(x => x.id === id);
    DEMOS = DEMOS.filter(x => x.id !== id);
    log('Demo deleted', d ? d.title : String(id)); closeDrawer(); render(); toast('Demo deleted'); return;
  }
  if (e.target.id === 'eu-save'){
    const idx = +e.target.dataset.idx;
    const perms = $$('.eu-perm:checked').map(x => x.value);
    const data = { name:$('#eu-name').value, email:$('#eu-email').value.trim().toLowerCase(),
      role:$('#eu-role').value, company:$('#eu-org').value, perms };
    if (idx >= 0){ Object.assign(ACCOUNTS[idx], data); log('User updated', data.email + ' → ' + data.role); }
    else { data.pw = digest($('#eu-pw').value || 'ChangeMe!26'); ACCOUNTS.push(data); log('User invited', data.email + ' → ' + data.role); }
    if (S.user && S.user.email === data.email){ S.user.role = data.role; S.user.perms = perms.slice(); }
    closeDrawer(); render(); toast(idx >= 0 ? 'User updated' : 'Invitation created'); return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'dr-status'){
    const r = CRM.find(x => x.id === +e.target.dataset.rec);
    if (r){ r.status = e.target.value; r.act = 'just now'; log('Stage changed', r.org + ' → ' + r.status); toast('Stage updated'); }
  }
  if (e.target.id === 'dr-next'){
    const r = CRM.find(x => x.id === +e.target.dataset.rec);
    if (r){ r.next = e.target.value; log('Next action set', r.org); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if ($('#modal').classList.contains('on')) closeModal();
    else if ($('#drawer').classList.contains('on')) closeDrawer();
  }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-rec], tr[data-editdemo], tr[data-edituser], tr[data-media], tr[data-model]')) e.target.click();
});

$('#scrim').addEventListener('click', () => {
  if ($('#modal').classList.contains('on')) closeModal();
  if ($('#drawer').classList.contains('on')) closeDrawer();
});

window.addEventListener('hashchange', () => { closeModal(); closeDrawer(); render(); });

if (!location.hash) location.replace('#/');
render();
</script>
